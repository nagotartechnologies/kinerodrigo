<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="512" height="512" rx="128" fill="#4F46E5"/>
  
  <!-- Cruz médica estilizada -->
  <g transform="translate(256, 256)">
    <!-- Barra vertical -->
    <rect x="-40" y="-140" width="80" height="280" rx="20" fill="white"/>
    <!-- Barra horizontal -->
    <rect x="-140" y="-40" width="280" height="80" rx="20" fill="white"/>
    
    <!-- Círculo central -->
    <circle cx="0" cy="0" r="50" fill="#4F46E5"/>
    <circle cx="0" cy="0" r="35" fill="white"/>
    
    <!-- Detalles decorativos -->
    <circle cx="0" cy="-100" r="15" fill="#4F46E5"/>
    <circle cx="0" cy="100" r="15" fill="#4F46E5"/>
    <circle cx="-100" cy="0" r="15" fill="#4F46E5"/>
    <circle cx="100" cy="0" r="15" fill="#4F46E5"/>
  </g>
  
  <!-- Texto NK (Nago-Kine) -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">NK</text>
</svg>
